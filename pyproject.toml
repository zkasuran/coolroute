[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coolroute"
version = "0.1.0"
description = "Heat-aware routing and scheduling agent built on hyperlocal 2m temperature data"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
